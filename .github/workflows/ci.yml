name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoices
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: invoices
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invoices -d invoices"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://invoices:ci@localhost:5432/invoices
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx -w @it/db prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (domain)
        run: npm test

      - name: Lint (web)
        run: npm run lint -w @it/web

      - name: Migrations apply on a clean Postgres 16
        run: npx -w @it/db prisma migrate deploy

      - name: Migrations match schema (no drift)
        run: >-
          npx -w @it/db prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

      - name: Seed reference (twice — must be idempotent)
        run: |
          npm exec -w @it/db -- tsx prisma/seed.ts --reference
          npm exec -w @it/db -- tsx prisma/seed.ts --reference

      - name: Seed admin + demo dataset (exercise the optional paths)
        env:
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_NAME: CI Admin
          SEED_DEMO: "1"
          SEED_DEMO_PASSWORD: ci-only-demo-password
        run: |
          npm exec -w @it/db -- tsx prisma/seed.ts > /dev/null
          npm exec -w @it/db -- tsx prisma/seed.ts > /dev/null

  # اختبارات شاملة لرحلة المستخلص في متصفح حقيقي (Playwright + Chromium)
  # على build إنتاجي وقاعدة نضيفة عليها البيانات التجريبية — apps/web/e2e
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoices
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: invoices
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invoices -d invoices"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://invoices:ci@localhost:5432/invoices
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_PASSWORD: ci-only-demo-password
      E2E_PORT: "3210"
      APP_URL: http://localhost:3210
      # الـ e2e بيبعت لعناوين ‎.test على Mailpit — في الإنتاج عناوين الاختبار ما بيتبعتلهاش
      MAIL_DELIVER_TEST_ADDRESSES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx -w @it/db prisma generate

      - name: Database (migrate + reference + demo data)
        env:
          SEED_DEMO: "1"
          SEED_DEMO_PASSWORD: ci-only-demo-password
        run: |
          npx -w @it/db prisma migrate deploy
          npm exec -w @it/db -- tsx prisma/seed.ts --reference > /dev/null
          npm exec -w @it/db -- tsx prisma/seed.ts > /dev/null

      - name: Playwright browser
        run: npx -w @it/web playwright install --with-deps chromium

      - name: Build
        run: npm run build -w @it/web

      - name: E2E
        env:
          UPLOAD_DIR: ${{ runner.temp }}/uploads
        run: npm run e2e -w @it/web

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
