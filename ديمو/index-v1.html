<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تتبع المستخلصات — ديمو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --p950:#1E0B32;--p900:#2E1148;--p800:#3D1A63;--p700:#4A2278;--p600:#5C2D91;--p500:#7343A8;--p300:#BFA3DA;--p200:#DCCCEB;--p100:#EDE5F4;--p50:#F6F2FA;
  --n0:#fff;--n25:#FAFAFB;--n50:#F5F5F7;--n100:#ECECF0;--n200:#DEDEE4;--n300:#C5C5CE;--n400:#9A9AA6;--n500:#71717F;--n600:#55555F;--n700:#3E3E46;--n900:#22222A;
  --ok7:#0E5C37;--ok6:#147D4B;--ok3:#7FC69F;--ok1:#E4F3EA;
  --wa7:#8A4F08;--wa6:#B4690E;--wa3:#EFC077;--wa1:#FDF2E1;
  --cr7:#8F1B2A;--cr6:#C0263A;--cr3:#E7959F;--cr1:#FBE9EB;
  --in7:#144F7C;--in6:#1B6AA5;--in3:#8FBEDC;--in1:#E7F1F8;
  --id6:#71717F;--id1:#F0F0F3;
  --shadow-card:0 1px 2px rgba(34,34,42,.05),0 1px 3px rgba(34,34,42,.06);
  --shadow-overlay:0 12px 32px rgba(30,11,50,.22);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Cairo,Arial,sans-serif;background:var(--n50);color:var(--n900);font-size:14px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
a{color:var(--p600)}
svg.lucide{width:16px;height:16px;stroke-width:1.75;flex:none}

/* header */
.hdr{height:60px;background:var(--p600);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:20}
.hdr img{height:36px;width:36px;background:#fff;border-radius:50%;padding:3px}
.hdr .ttl{font-weight:700;font-size:17px;line-height:1.2}
.hdr .ttl small{display:block;font-weight:400;font-size:11px;opacity:.75}
.hdr .sp{flex:1}
.hdr .role{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:5px;padding:4px 10px}
.hdr .role select{background:transparent;border:0;color:#fff;font-weight:600;outline:none;max-width:260px}
.hdr .role select option{color:var(--n900)}
.hdr .ib{background:rgba(255,255,255,.12);border:0;color:#fff;width:36px;height:34px;border-radius:5px;display:grid;place-items:center;cursor:pointer;position:relative}
.hdr .ib:hover{background:rgba(255,255,255,.2)}
.hdr .dot{position:absolute;top:5px;left:6px;background:var(--cr6);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;font-weight:700}
.demo{background:var(--p900);color:rgba(255,255,255,.8);font-size:12px;padding:4px 20px;display:flex;gap:8px;align-items:center}

/* layout */
.wrap{display:flex;min-height:calc(100vh - 88px)}
.side{width:236px;background:#fff;border-left:1px solid var(--n100);padding:16px 10px;flex:none}
.side .sec{font-size:11px;color:var(--n400);font-weight:600;padding:12px 12px 6px;letter-spacing:.02em}
.side a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:5px;color:var(--n700);text-decoration:none;font-weight:500;cursor:pointer;border-right:3px solid transparent;margin-bottom:2px}
.side a:hover{background:var(--n25)}
.side a.on{background:var(--p50);color:var(--p600);border-right-color:var(--p600);font-weight:600}
.side a .cnt{margin-right:auto;background:var(--cr1);color:var(--cr7);font-size:11px;padding:0 7px;border-radius:3px;font-weight:700}
.main{flex:1;padding:24px 28px;min-width:0}

/* page header */
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:24px;margin:0;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--n600)}
.ph .sp{flex:1}

/* card */
.card{background:#fff;border:1px solid var(--n100);border-radius:8px;box-shadow:var(--shadow-card)}
.card .ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--n100)}
.card .ch h3{margin:0;font-size:16px;font-weight:600}
.card .ch .sp{flex:1}
.card .cb{padding:16px 18px}
.card .cf{padding:8px 18px;background:var(--n25);border-top:1px solid var(--n100);color:var(--n500);font-size:12px;border-radius:0 0 8px 8px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1.4fr 1fr}
.mb{margin-bottom:16px}

/* kpi */
.kpi{padding:16px 18px}
.kpi .l{color:var(--n600);font-weight:500;font-size:13px;display:flex;align-items:center;gap:8px}
.kpi .l .ic{width:28px;height:28px;border-radius:5px;background:var(--p50);color:var(--p600);display:grid;place-items:center}
.kpi .v{font-size:30px;font-weight:700;line-height:1.2;margin-top:8px}
.kpi .s{color:var(--n500);font-size:12px}
.kpi.bad{border-top:3px solid var(--cr6)}
.kpi.bad .v{color:var(--cr6)}
.kpi.ok{border-top:3px solid var(--ok6)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:5px;border:1px solid var(--n200);background:#fff;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{border-color:var(--n300);background:var(--n25)}
.btn.pr{background:var(--p600);border-color:var(--p600);color:#fff}
.btn.pr:hover{background:var(--p700)}
.btn.dg{color:var(--cr6);border-color:var(--cr3)}
.btn.dg:hover{background:var(--cr1)}
.btn.ok{background:var(--ok6);border-color:var(--ok6);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* badges */
.bd{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border-radius:3px;font-size:12px;font-weight:600;white-space:nowrap}
.bd::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bd.g{background:var(--ok1);color:var(--ok7)}
.bd.a{background:var(--wa1);color:var(--wa7)}
.bd.r{background:var(--cr1);color:var(--cr7)}
.bd.b{background:var(--in1);color:var(--in7)}
.bd.n{background:var(--id1);color:var(--n600)}
.bd.p{background:var(--p50);color:var(--p600)}
.cat{display:inline-block;font-weight:700;font-size:12px;padding:0 7px;border-radius:3px;border:1px solid var(--p200);color:var(--p600);background:var(--p50)}
.cat.x{border-color:var(--n200);color:var(--n500);background:var(--n50);font-weight:500}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-weight:600;color:var(--n600);font-size:12px;text-align:right;padding:9px 12px;border-bottom:1px solid var(--n200);background:var(--n25);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--n100);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--n25)}
tr.flag td:first-child{box-shadow:inset -3px 0 0 var(--cr6)}
td.mut{color:var(--n500);font-size:13px}

/* filters */
.fbar{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px;padding:12px 18px;border-bottom:1px solid var(--n100)}
.in,.sel{height:34px;border:1px solid var(--n200);border-radius:5px;padding:0 10px;background:#fff;width:100%}
.in:focus,.sel:focus,textarea:focus{outline:2px solid var(--p500);outline-offset:1px}
textarea{border:1px solid var(--n200);border-radius:5px;padding:8px 10px;width:100%;resize:vertical}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-weight:500;font-size:13px;color:var(--n700)}
.fld .h{font-size:12px;color:var(--n500)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--n100)}
.chip{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--n200);background:#fff;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--p600);color:#fff;border-color:var(--p600)}

/* pipeline bars */
.pipe .row{display:grid;grid-template-columns:210px 1fr 90px;gap:12px;align-items:center;padding:6px 0}
.pipe .nm{font-size:13px;line-height:1.3}
.pipe .nm small{display:block;color:var(--n500);font-size:11px}
.pipe .bar{height:18px;background:var(--n50);border-radius:3px;display:flex;overflow:hidden}
.pipe .bar span{height:100%}
.pipe .vv{font-size:12px;color:var(--n600);text-align:left}
.legend{display:flex;gap:14px;font-size:12px;color:var(--n600);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:5px;vertical-align:-1px}

/* stepper */
.stepper{display:flex;gap:0;overflow-x:auto;padding:4px 2px 12px}
.st{flex:1 0 118px;position:relative;padding-top:4px;text-align:center}
.st::before{content:"";position:absolute;top:18px;right:50%;left:-50%;height:2px;background:var(--n200);z-index:0}
.st:first-child::before{display:none}
.st.done::before,.st.cur::before{background:var(--ok6)}
.st .c{width:30px;height:30px;border-radius:50%;margin:0 auto;display:grid;place-items:center;position:relative;z-index:1;background:#fff;border:2px solid var(--n300);color:var(--n500);font-weight:700;font-size:12px}
.st.done .c{background:var(--ok6);border-color:var(--ok6);color:#fff}
.st.cur .c{border-width:3px}
.st.cur.g .c{border-color:var(--ok6);color:var(--ok7)}
.st.cur.a .c{border-color:var(--wa6);color:var(--wa7)}
.st.cur.r .c{border-color:var(--cr6);color:var(--cr7);background:var(--cr1)}
.st.cur.b .c{border-color:var(--in6);color:var(--in7)}
.st .t{font-size:12px;font-weight:600;margin-top:6px;line-height:1.3;padding:0 4px}
.st .d{font-size:11px;color:var(--n500);line-height:1.3;padding:0 4px}
.st.cur .t{color:var(--p600)}

/* timeline */
.tl{position:relative;padding-right:22px}
.tl::before{content:"";position:absolute;right:7px;top:6px;bottom:6px;width:2px;background:var(--n100)}
.tli{position:relative;padding:0 0 16px}
.tli::before{content:"";position:absolute;right:-20px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--p600)}
.tli.rej::before{border-color:var(--cr6);background:var(--cr1)}
.tli.pay::before{border-color:var(--ok6);background:var(--ok6)}
.tli .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tli .h b{font-weight:600}
.tli .m{color:var(--n500);font-size:12px}
.tli .note{background:var(--n50);border-radius:5px;padding:8px 10px;margin-top:6px;font-size:13px;white-space:pre-line}
.tli.rej .note{background:var(--cr1);color:var(--cr7)}

/* misc */
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 20px}
.kv div span{display:block;font-size:12px;color:var(--n500)}
.kv div b{font-weight:600}
.alert{border-right:3px solid var(--wa6);background:var(--wa1);color:var(--wa7);padding:10px 14px;border-radius:5px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.alert.r{border-color:var(--cr6);background:var(--cr1);color:var(--cr7)}
.alert.i{border-color:var(--in6);background:var(--in1);color:var(--in7)}
.mini{height:6px;background:var(--n100);border-radius:3px;overflow:hidden;margin-top:6px}
.mini span{display:block;height:100%;background:var(--p600);border-radius:3px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--n200);margin-bottom:16px}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:500;color:var(--n600);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--p600);border-bottom-color:var(--p600);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--n500)}
.slainp{width:52px;height:28px;text-align:center;border:1px solid var(--n200);border-radius:5px}
.matrix td,.matrix th{text-align:center}
.matrix td:nth-child(2),.matrix th:nth-child(2),.matrix td:nth-child(3),.matrix th:nth-child(3){text-align:right}
.matrix tfoot td{font-weight:700;background:var(--p50);color:var(--p600)}

/* invoice cards (company) */
.ic{padding:14px 16px;cursor:pointer}
.ic:hover{box-shadow:0 4px 12px rgba(34,34,42,.1)}
.ic .top{display:flex;gap:8px;align-items:center}
.ic .top b{font-size:15px}
.ic .where{margin-top:8px;font-size:13px;color:var(--n600)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(30,11,50,.44);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;box-shadow:var(--shadow-overlay);width:min(560px,100%);max-height:90vh;overflow:auto}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--n100);display:flex;align-items:center}
.modal .mh h3{margin:0;font-size:17px;flex:1}
.modal .mb2{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:12px 20px;border-top:1px solid var(--n100);display:flex;gap:8px;justify-content:flex-start}
.toast{position:fixed;bottom:20px;left:20px;background:var(--n900);color:#fff;padding:10px 16px;border-radius:5px;z-index:60;font-size:13px;box-shadow:var(--shadow-overlay)}
.notif{position:absolute;top:56px;left:20px;width:360px;background:#fff;color:var(--n900);border-radius:8px;box-shadow:var(--shadow-overlay);z-index:40;max-height:420px;overflow:auto}
.notif .it{padding:10px 14px;border-bottom:1px solid var(--n100);font-size:13px}
.notif .it small{display:block;color:var(--n500);font-size:11px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--n50);padding:16px}
.login .box{width:min(440px,100%);padding:32px}
.login img{height:40px;margin-bottom:20px}
.login h1{font-size:22px;margin:0 0 4px}
.login .roles{display:grid;gap:8px;margin-top:16px}
.login .roles button{text-align:right;justify-content:flex-start;height:auto;padding:10px 14px}
.login .roles small{display:block;font-weight:400;color:var(--n500);font-size:12px}

/* tour */
.tour{position:fixed;bottom:16px;left:16px;width:400px;background:#fff;border-radius:12px;box-shadow:var(--shadow-overlay);border-top:3px solid var(--p600);z-index:70;padding:14px 16px}
.tour .th{display:flex;align-items:center;gap:8px}
.tour .who{display:inline-flex;align-items:center;gap:6px;background:var(--p50);color:var(--p600);font-weight:600;font-size:13px;padding:3px 10px;border-radius:5px;flex:1;min-width:0}
.tour .tc{color:var(--n500);font-size:12px}
.tour h3{margin:10px 0 4px;font-size:17px;line-height:1.35}
.tour p{margin:0;color:var(--n700);font-size:14px;line-height:1.7}
.tour .tdate{display:flex;align-items:center;gap:6px;color:var(--n500);font-size:12px;margin-top:8px}
.tour .tprog{height:4px;background:var(--n100);border-radius:2px;margin:12px 0;overflow:hidden}
.tour .tprog span{display:block;height:100%;background:var(--p600)}
.tour .tb{display:flex;gap:8px;justify-content:space-between}
.hdr .tourbtn{width:auto;padding:0 12px;gap:6px;display:flex;font-weight:600}
tr.tourrow td{background:var(--p50)}
tr.tourrow td:first-child{box-shadow:inset -3px 0 0 var(--p600)}
.card.tourcard{border-color:var(--p600);box-shadow:0 0 0 2px var(--p200)}
@media (max-width:600px){.tour{left:8px;right:8px;width:auto;bottom:8px}.tour p{font-size:13px}}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.kv{grid-template-columns:repeat(2,1fr)}.fbar{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.hdr{gap:8px;padding:0 10px}.hdr .ttl{font-size:14px}.hdr .role{padding:4px 6px}.hdr .role svg{display:none}.hdr .role select{max-width:110px}.ph h1{font-size:19px}.g4{grid-template-columns:1fr}.demo{padding:4px 10px}}
@media (max-width:820px){.side{display:none}.main{padding:16px}.hdr .ttl small{display:none}.pipe .row{grid-template-columns:120px 1fr 60px}.hdr .role select{max-width:150px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ SLA config (من صورة مسار اعتماد وصرف المستخلصات) ============ */
const STEPS = {
  sup:{n:'الحصر المشترك وتوقيع المشرف',d:'مشرف المصرية'},
  t1:{n:'التأشير والتسجيل',d:'المكتب الفني'},
  t2:{n:'مراجعة وتوقيع مدير التنفيذ',d:'إدارة التنفيذ'},
  t3:{n:'مراجعة وتوقيع المدير العام',d:'المدير العام'},
  t4:{n:'المراجعة الفنية وتحديد التجاوز',d:'الشؤون الفنية'},
  o1:{n:'مذكرة التجاوز ومخاطبة جهة الموافقة',d:'المدير العام'},
  o2:{n:'مراجعة التخطيط',d:'قطاع التخطيط'},
  o3:{n:'موافقة النائب على مذكرة التجاوز',d:'مكتب النائب'},
  o4:{n:'اعتماد زيادة أمر التكليف',d:'مكتب النائب'},
  o5:{n:'اللجنة العليا / تعديل أمر التكليف',d:'اللجنة العليا'},
  o6:{n:'تسعير البند وإصداره في أمر تكليف',d:'التخطيط / المشتريات'},
  o7:{n:'استكمال المراجعة بعد الموافقة',d:'الشؤون الفنية'},
  t5:{n:'اعتماد رئيس القطاع',d:'رئيس القطاع'},
  t6:{n:'الإحالة للمخازن والمشتريات',d:'الشؤون الفنية'},
  t7:{n:'مراجعة التأمينات والاستقطاعات',d:'المخازن والمشتريات'},
  pay:{n:'الصرف من المالية',d:'المالية'},
};
const STEP_ORDER=['sup','t1','t2','t3','t4','o1','o2','o3','o4','o5','o6','o7','t5','t6','t7','pay'];
const BASE={t1:1,t3:1,t5:1,t6:1,t7:2};
const CATS = {
  C1:{n:'لا يوجد تجاوز بنود ولا إجمالي',s:{...BASE,t2:2,t4:2}},
  C2:{n:'بند متجاوز والإجمالي لم يتجاوز',s:{...BASE,t2:1,t4:4,o1:2,o2:3,o7:1}},
  C3:{n:'تجاوز حتى 25% من أمر التكليف',s:{...BASE,t2:1,t4:4,o1:2,o2:3,o7:1}},
  C4:{n:'تجاوز أكثر من 25% من أمر التكليف',s:{...BASE,t2:1,t4:4,o1:2,o2:3,o3:1,o4:3,o5:7,o7:1}},
  C5:{n:'البند ليس له قيمة في العقد',s:{...BASE,t2:1,t4:4,o1:2,o2:3,o3:1,o4:3,o5:7,o6:10,o7:1}},
};
const PAY_SLA = {v:null}; // يحدده الـ admin لاحقاً
const DEPTS=[...new Set(Object.values(STEPS).map(s=>s.d))];
let HOLIDAYS=['2026-01-07','2026-01-25','2026-04-12','2026-04-13','2026-04-25','2026-05-01','2026-05-26','2026-05-27','2026-05-28','2026-06-16','2026-06-30','2026-07-23','2026-08-25','2026-10-06'];
const COMPANIES=['الصفا','بريدج','المعادي'];
const CONTRACTS={'الصفا':['77/2025/1/5','301/2024/3/9'],'بريدج':['232/2025/1/36','118/2024/2/12'],'المعادي':['45/2025/1/2','190/2024/1/14']};
const REGIONS=['المنصورة','الزقازيق','طنطا','دمياط','بنها'];

/* ============ dates / working days ============ */
const DAY=864e5;
let TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const isWork=d=>{const w=d.getDay();return w!==5&&w!==6&&!HOLIDAYS.includes(iso(d))};
function wdBetween(a,b){ // أيام العمل بعد a لحد b
  let n=0,d=new Date(a);d.setHours(0,0,0,0);const e=new Date(b);e.setHours(0,0,0,0);
  while(d<e){d=new Date(d.getTime()+DAY);if(isWork(d))n++}return n}
function addWd(a,n){let d=new Date(a);d.setHours(0,0,0,0);const s=n<0?-1:1;let k=Math.abs(n);while(k>0){d=new Date(d.getTime()+s*DAY);if(isWork(d))k--}return d}
const fmtD=d=>{d=new Date(d);return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`};
const money=v=>Math.round(v).toLocaleString('en-US');
const mShort=v=>v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':money(v);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function pathOf(cat){ if(!cat) return ['sup','t1','t2','t3','t4']; return ['sup',...STEP_ORDER.filter(k=>k in CATS[cat].s),'pay'] }
function slaOf(cat,step){ if(step==='pay')return PAY_SLA.v; if(step==='sup')return null; return CATS[cat||'C1'].s[step]??null }
function catTotal(cat){return Object.values(CATS[cat].s).reduce((a,b)=>a+b,0)}

const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));const pick=a=>a[Math.floor(rnd()*a.length)];

let INV=[];
(function gen(){
  let id=1;
  COMPANIES.forEach(co=>{
    const n=co==='بريدج'?18:co==='الصفا'?14:12;
    for(let i=0;i<n;i++){
      const cat=pick(['C1','C1','C1','C2','C2','C3','C4','C5']);
      const path=pathOf(cat);
      let d=addWd(TODAY,-ri(3,42));
      const inv={id:id++,no:String(ri(20,190)),co,contract:pick(CONTRACTS[co]),wo:'WO-'+ri(1000,4999),region:pick(REGIONS),period:pick(['يوليو 2026','أغسطس 2026','سبتمبر 2026','يونيو 2026']),amount:ri(15,350)*1e4+ri(0,9999),cat,step:null,status:'active',since:null,events:[],flags:[],mode:'إجمالي'};
      inv.events.push({t:'submit',step:'sub',date:d,by:co,note:'تم تقديم المستخلص على البوابة'});
      let placed=false;
      for(const st of path){
        inv.events.push({t:'in',step:st,date:d,by:PEOPLE[STEPS[st].d]});
        const sla=slaOf(cat,st);
        let dur=sla?Math.max(1,sla+ri(-1,sla>3?6:3)):ri(1,3);
        if(st==='pay')dur=ri(3,12);
        // رفض عشوائي
        if(['t2','t4','t7'].includes(st)&&rnd()<.12){
          const rd=addWd(d,ri(1,2));if(rd>TODAY){inv.step=st;inv.since=d;placed=true;break}
          inv.events.push({t:'reject',step:st,date:rd,by:PEOPLE['إدارة التنفيذ'],note:pick(REJ_NOTES)});
          const back=addWd(rd,ri(2,6));
          if(back>TODAY){inv.step=st;inv.status='rejected';inv.rejFrom=st;inv.since=rd;placed=true;break}
          inv.events.push({t:'resubmit',step:st,date:back,by:co,note:'تم استيفاء الملاحظات وإعادة التقديم'});inv.events.push({t:'in',step:st,date:back,by:PEOPLE[STEPS[st].d]});
          d=back;
        }
        const nd=addWd(d,dur);
        if(nd>TODAY){inv.step=st;inv.since=d;placed=true;break}
        d=nd;
      }
      if(!placed){inv.step='done';inv.status='paid';inv.since=d;inv.events.push({t:'paid',step:'pay',date:d,by:PEOPLE['المالية'],note:'تم الصرف — شيك/تحويل رقم '+ri(10000,99999)})}
      if(['sup','t1','t2','t3','t4'].includes(inv.step)&&rnd()<.75)inv.cat=null;
      INV.push(inv);
    }
  });
  const b=INV.find(x=>x.co==='بريدج'&&x.status==='active');if(b){b.no='55';b.flags.push('القيمة في تراكر المصرية 126.1M — غالباً خطأ كتابة (1.26M)')}
})();

/* ============ status helpers ============ */
function stat(inv){
  if(inv.status==='paid')return{k:'paid',cls:'g',lbl:'تم الصرف',el:null,sla:null};
  if(inv.status==='rejected'){const el=wdBetween(inv.since,TODAY);return{k:'rej',cls:'b',lbl:'مرتجع — عند الشركة',el,sla:null}}
  const el=wdBetween(inv.since,TODAY),sla=slaOf(inv.cat,inv.step);
  if(sla==null)return{k:'nosla',cls:'n',lbl:'بدون SLA',el,sla};
  if(el>sla)return{k:'late',cls:'r',lbl:'متأخر',el,sla};
  if(el===sla)return{k:'due',cls:'a',lbl:'آخر يوم',el,sla};
  return{k:'ok',cls:'g',lbl:'في الميعاد',el,sla};
}

function vSide(){
  const r=role(),a=k=>S.route===k||(k==='list'&&S.route==='inv'&&S.from!=='inbox')?'on':'';
  const lateCnt=visible().filter(i=>stat(i).k==='late').length;
  if(r.t==='co'){
    const rej=visible().filter(i=>i.status==='rejected').length;
    return `<nav class="side"><div class="sec">بوابة الشركة — ${esc(r.v)}</div>
     <a class="${a('co-home')}" onclick="go('co-home')"><i data-lucide="layout-list"></i>مستخلصاتي</a>
     <a class="${a('co-new')}" onclick="go('co-new')"><i data-lucide="file-plus-2"></i>تقديم مستخلص جديد</a>
     <a class="${a('co-rej')}" onclick="go('co-rej')"><i data-lucide="undo-2"></i>مطلوب الرد${rej?`<span class="cnt num">${rej}</span>`:''}</a>
     <a class="${a('ded')}" onclick="go('ded')"><i data-lucide="landmark"></i>الاستقطاعات وخطابات الضمان</a>
     <div class="sec">مرجع</div><a class="${a('flow')}" onclick="go('flow')"><i data-lucide="git-branch"></i>مسار الاعتماد والـ SLA</a></nav>`;
  }
  if(r.t==='dept'){
    const mine=INV.filter(i=>i.status==='active'&&STEPS[i.step].d===r.v).length;
    return `<nav class="side"><div class="sec">${esc(r.v)}</div>
     <a class="${a('inbox')}" onclick="go('inbox')"><i data-lucide="inbox"></i>صندوق الوارد<span class="cnt num" style="background:var(--p50);color:var(--p600)">${mine}</span></a>

  const avgCyc=cyc.length?cyc.reduce((a,b)=>a+b.el,0)/cyc.length:0,avgSla=cyc.length?cyc.reduce((a,b)=>a+b.sla,0)/cyc.length:0;
  const sum=a=>a.reduce((s,i)=>s+i.amount,0);

  const rows=[...STEP_ORDER.map(k=>({k,n:STEPS[k].n,d:STEPS[k].d,items:open.filter(i=>i.status==='active'&&i.step===k)})),{k:'rej',n:'مرتجع — عند الشركة',d:'الشركة المنفذة',items:open.filter(i=>i.status==='rejected')}];

  const depts=[...DEPTS,'الشركة المنفذة'].map(d=>{const it=open.filter(i=>deptOf(i)===d);const st=it.map(stat);return{d,n:it.length,late:st.filter(s=>s.k==='late').length,avg:it.length?st.reduce((a,s)=>a+s.el,0)/it.length:0,max:it.length?Math.max(...st.map(s=>s.el-(s.sla||0))):0,val:sum(it)}}).filter(x=>x.n).sort((a,b)=>b.late-a.late||b.n-a.n);
  // per step on-time from history

  return `<div class="ph"><div><h1>${late.length} مستخلص متأخر عن الـ SLA بقيمة ${mShort(sum(late))} جنيه</h1><p>الموقف النهارده ${fmtD(TODAY)} — الشركات: ${COMPANIES.join('، ')}</p></div><div class="sp"></div><button class="btn" onclick="go('report')"><i data-lucide="file-down"></i>التقرير الأسبوعي</button></div>
  <div class="grid g4 mb">
   ${kpi('file-stack','مستخلصات مفتوحة',open.length,`بقيمة <span class="num">${mShort(sum(open))}</span> جنيه`)}
   ${kpi('alarm-clock','متأخرة عن الـ SLA',late.length,`<span class="num">${(late.length/Math.max(1,open.length)*100).toFixed(1)}%</span> من المفتوح`,'bad')}
   ${kpi('timer','متوسط دورة المستخلص',avgCyc.toFixed(1)+' يوم',`مقابل SLA متوسط <span class="num">${avgSla.toFixed(1)}</span> يوم عمل`)}
   ${kpi('banknote','اتصرف آخر شهر',paid30.length,`بقيمة <span class="num">${mShort(sum(paid30))}</span> جنيه`,'ok')}
  </div>
  <div class="grid g2 mb">
   <div class="card"><div class="ch"><i data-lucide="git-commit-horizontal"></i><h3>المستخلصات المفتوحة في كل خطوة</h3><div class="sp"></div><div class="legend"><span><i style="background:var(--ok6)"></i>في الميعاد</span><span><i style="background:var(--wa6)"></i>آخر يوم</span><span><i style="background:var(--cr6)"></i>متأخر</span><span><i style="background:var(--n300)"></i>بدون SLA</span></div></div>
    <div class="cb pipe">${rows.map(r=>{const st=r.items.map(stat);const c=k=>st.filter(s=>s.k===k).length;const w=n=>n/mx*100+'%';
     return `<div class="row"><div class="nm">${esc(r.n)}<small>${esc(r.d)}</small></div><div class="bar"><span style="width:${w(c('ok'))};background:var(--ok6)"></span><span style="width:${w(c('due'))};background:var(--wa6)"></span><span style="width:${w(c('late'))};background:var(--cr6)"></span><span style="width:${w(c('nosla')+c('rej'))};background:var(--n300)"></span></div><div class="vv"><span class="num">${r.items.length}</span>${c('late')?` · <span style="color:var(--cr6)" class="num">${c('late')} متأخر</span>`:''}</div></div>`}).join('')}</div></div>
   <div class="card"><div class="ch"><i data-lucide="building-2"></i><h3>المتأخر عند كل إدارة</h3></div><div class="tw"><table><thead><tr><th>الإدارة</th><th>عندها</th><th>متأخر</th><th>متوسط الأيام</th><th>أسوأ تأخير</th></tr></thead><tbody>
    ${depts.map(d=>`<tr class="click ${d.late?'flag':''}" onclick="S.f={...S.f,dept:'${esc(d.d)}',st:''};go('list')"><td>${esc(d.d)}</td><td class="num">${d.n}</td><td>${d.late?`<span class="bd r num">${d.late}</span>`:'<span class="mut">—</span>'}</td><td class="num">${d.avg.toFixed(1)}</td><td>${d.max>0?`<span class="num" style="color:var(--cr6)">+${d.max} يوم</span>`:'<span class="mut">—</span>'}</td></tr>`).join('')}
   </tbody></table></div><div class="cf">دوس على أي إدارة عشان تشوف مستخلصاتها</div></div>
  </div>
  <div class="grid g3">
   <div class="card"><div class="ch"><i data-lucide="hard-hat"></i><h3>موقف كل شركة</h3></div><div class="tw"><table><thead><tr><th>الشركة</th><th>مفتوح</th><th>القيمة</th><th>متأخر</th><th>اتصرف</th></tr></thead><tbody>
    ${COMPANIES.map(c=>{const o=open.filter(i=>i.co===c);return `<tr class="click" onclick="S.f={...S.f,co:'${c}'};go('list')"><td><b>${c}</b></td><td class="num">${o.length}</td><td class="num">${mShort(sum(o))}</td><td class="num" style="color:var(--cr6)">${o.filter(i=>stat(i).k==='late').length}</td><td class="num">${paid.filter(i=>i.co===c).length}</td></tr>`}).join('')}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><i data-lucide="split"></i><h3>حسب فئة التجاوز</h3></div><div class="tw"><table><thead><tr><th>الفئة</th><th>مفتوح</th><th>SLA</th><th>متوسط الدورة (المصروف)</th></tr></thead><tbody>
    ${Object.keys(CATS).map(c=>{const o=open.filter(i=>i.cat===c);const p=paid.filter(i=>i.cat===c).map(totalEl).filter(x=>x!=null);const av=p.length?p.reduce((a,b)=>a+b,0)/p.length:null;const t=catTotal(c);return `<tr><td>${catBadge(c)}</td><td class="num">${o.length}</td><td class="num">${t} يوم</td><td>${av==null?'<span class="mut">—</span>':`<span class="num" style="color:${av>t?'var(--cr6)':'var(--ok7)'}">${av.toFixed(1)} يوم</span>`}</td></tr>`}).join('')}
    <tr><td>${catBadge(null)}</td><td class="num">${open.filter(i=>!i.cat).length}</td><td class="mut">—</td><td class="mut">التنفيذ يحددها</td></tr>
   </tbody></table></div></div>
   <div class="card"><div class="ch"><i data-lucide="target"></i><h3>الالتزام بالـ SLA في كل خطوة</h3></div><div class="tw"><table><thead><tr><th>الخطوة</th><th>متوسط</th><th>% في الميعاد</th></tr></thead><tbody>
    ${STEP_ORDER.filter(k=>hist[k]).map(k=>{const h=hist[k];const av=h.reduce((a,b)=>a+b.el,0)/h.length;const on=h.filter(x=>x.el<=x.sla).length/h.length*100;return `<tr><td style="font-size:13px">${esc(STEPS[k].n)}</td><td class="num">${av.toFixed(1)}</td><td><span class="bd ${on>=80?'g':on>=60?'a':'r'} num">${on.toFixed(0)}%</span></td></tr>`}).join('')}
   </tbody></table></div><div class="cf">محسوبة من حركة المستخلصات اللي عدّت على كل خطوة</div></div>
  </div>`;
}
function kpi(ic,l,v,s,cls=''){return `<div class="card kpi ${cls}"><div class="l"><span class="ic"><i data-lucide="${ic}"></i></span>${l}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`}

/* ---------- list ---------- */
function filtered(){
  const f=S.f;return visible().filter(i=>{
    if(f.q&&!(`${i.no} ${i.contract} ${i.co} ${i.wo} ${i.region}`.includes(f.q)))return false;
    if(f.co&&i.co!==f.co)return false;
    if(f.cat&&(f.cat==='none'?i.cat:i.cat!==f.cat))return false;
    if(f.step&&(f.step==='rej'?i.status!=='rejected':f.step==='done'?i.status!=='paid':(i.step!==f.step||i.status!=='active')))return false;
    if(f.dept&&deptOf(i)!==f.dept)return false;
    if(f.st&&stat(i).k!==f.st)return false;
    return true}).sort((a,b)=>{const sa=stat(a),sb=stat(b);const o={late:0,due:1,ok:2,rej:3,nosla:4,paid:5};return o[sa.k]-o[sb.k]||((sb.el-(sb.sla||0))-(sa.el-(sa.sla||0)))});
}

   ${showCo?`<td>${esc(i.co)}</td>`:''}<td class="num">${esc(i.contract)}</td><td class="num">${money(i.amount)}</td><td>${catBadge(i.cat)}</td>
   <td>${esc(stepName(i))}<div class="mut" style="font-size:12px">${esc(deptOf(i))}</div></td>
   <td>${s.el==null?'<span class="mut">—</span>':`<span class="num">${s.el}${s.sla!=null?' / '+s.sla:''}</span> <span class="mut">يوم</span>`}</td>
   <td><span class="bd ${s.cls}">${s.lbl}</span></td>
   <td class="mut">${t==null?'—':`<span class="num">${t}${i.cat?' / '+catTotal(i.cat):''}</span>`}</td></tr>`}

function exportList(){

/* ---------- invoice detail ---------- */
function vInv(){
  const i=INV.find(x=>x.id===S.sel);if(!i)return'';const r=role();
  if(r.t==='co'&&i.co!==r.v)return `<div class="card empty">مش مسموح تشوف المستخلص ده</div>`;
  const s=stat(i),path=pathOf(i.cat),curIdx=i.status==='paid'?path.length:path.indexOf(i.step);
  const back=S.from==='inbox'?'inbox':r.t==='co'?'co-home':'list';
  const stepper=[...path,...(i.cat?[]:['?'])].map((k,idx)=>{
    if(k==='?')return `<div class="st"><div class="c">?</div><div class="t">باقي المسار</div><div class="d">بيتحدد بعد اختيار الفئة</div></div>`;
    const done=idx<curIdx,cur=idx===curIdx;const sla=slaOf(i.cat,k);
    return `<div class="st ${done?'done':''} ${cur?'cur '+(i.status==='rejected'?'b':s.cls):''}"><div class="c">${done?'<i data-lucide="check" style="width:14px;height:14px"></i>':idx+1}</div><div class="t">${esc(STEPS[k].n)}</div><div class="d">${esc(STEPS[k].d)}${sla!=null?` · <span class="num">${sla}</span> يوم`:''}</div></div>`}).join('');
  const t=totalEl(i);
  // timeline with durations
  const ev=i.events.slice();
  const tl=ev.map((e,k)=>{const nx=ev.slice(k+1).find(x=>x.t!=='submit');let dur='';
    if(e.t==='in'){const end=nx?nx.date:(i.status==='paid'?i.since:TODAY);const el=wdBetween(e.date,end);const sla=slaOf(i.cat,e.step);dur=`<span class="bd ${sla==null?'n':el>sla?'r':el===sla?'a':'g'} num">${el} يوم${sla!=null?' / '+sla:''}</span>${nx?'':' <span class="m">(لسه فيها)</span>'}`}
    const lbl={submit:'تقديم المستخلص',in:'وصل إلى: '+(STEPS[e.step]?.n||''),reject:'مرتجع للشركة من: '+(STEPS[e.step]?.n||''),resubmit:'رد الشركة وإعادة التقديم',paid:'تم الصرف',cat:'تحديد/تغيير الفئة'}[e.t];
    return `<div class="tli ${e.t==='reject'?'rej':e.t==='paid'?'pay':''}"><div class="h"><b>${esc(lbl)}</b>${dur}</div><div class="m"><span class="num">${fmtD(e.date)}</span> · ${esc(e.by||'')}${STEPS[e.step]&&e.t==='in'?' · '+esc(STEPS[e.step].d):''}</div>${e.note?`<div class="note">${esc(e.note)}</div>`:''}</div>`}).reverse().join('');
  let actions='';

    actions=`<div class="card mb"><div class="ch"><i data-lucide="mouse-pointer-click"></i><h3>الإجراء المطلوب منك</h3><div class="sp"></div><span class="bd ${s.cls}">${s.lbl} — <span class="num">${s.el}${s.sla!=null?' / '+s.sla:''}</span> يوم</span></div><div class="cb" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
     <button class="btn pr" onclick="openMove(${i.id})"><i data-lucide="send"></i>${i.step==='pay'?'تأكيد الصرف':'اعتماد وتسليم لـ: '+esc(nextName(i))}</button>
     <button class="btn dg" onclick="openReject(${i.id})"><i data-lucide="undo-2"></i>إرجاع للشركة بالملاحظات</button>
     ${['t4','o2','o7'].includes(i.step)||role().t==='admin'?`<button class="btn" onclick="openCat(${i.id})"><i data-lucide="split"></i>${i.cat?'تغيير الفئة':'تحديد الفئة'}</button>`:''}
     <button class="btn" onclick="toast('في النسخة الحقيقية: رفع ملف PDF/صورة')"><i data-lucide="paperclip"></i>إرفاق مستند</button>
     ${isS2&&!i.cat?`<div class="alert" style="width:100%"><i data-lucide="alert-triangle"></i><div>لازم الشؤون الفنية تحدد فيه تجاوز ولا لأ (الفئة C1–C5) قبل التسليم، لأن الفئة هي اللي بتحدد باقي المسار والـ SLA.</div></div>`:''}
    </div></div>`;
  } else if(i.status==='rejected'&&r.t==='co'){

function exportReport(){if(!window.XLSX){toast('مكتبة Excel مش متحملة — محتاج إنترنت');return}
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};const open=INV.filter(i=>i.status!=='paid');
  const add=(n,rows)=>{const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'-':'لا يوجد'}]);ws['!cols']=Object.keys(rows[0]||{a:1}).map(()=>({wch:20}));XLSX.utils.book_append_sheet(wb,ws,n)};
  add('الملخص',COMPANIES.map(c=>({'الشركة':c,'مفتوح':open.filter(i=>i.co===c).length,'قيمة المفتوح':open.filter(i=>i.co===c).reduce((a,i)=>a+i.amount,0),'متأخر':open.filter(i=>i.co===c&&stat(i).k==='late').length,'اتصرف':INV.filter(i=>i.co===c&&i.status==='paid').length})));
  add('المتأخر',open.filter(i=>stat(i).k==='late').map(i=>{const s=stat(i);return{'الشركة':i.co,'الفاتورة':i.no,'العقد':i.contract,'القيمة':i.amount,'الخطوة':stepName(i),'الإدارة':deptOf(i),'الأيام':s.el,'SLA':s.sla,'التأخير':s.el-s.sla}}));
  add('اتصرف الأسبوع',INV.filter(i=>i.status==='paid'&&wdBetween(i.since,TODAY)<=5).map(i=>({'الشركة':i.co,'الفاتورة':i.no,'القيمة':i.amount,'تاريخ الصرف':fmtD(i.since),'إجمالي الدورة':totalEl(i)})));
  add('الاستقطاعات',DED.map(d=>({'الشركة':d.co,'العقد':d.contract,'النوع':d.type,'المبلغ':d.amount,'ميعاد الإفراج':d.due,'الحالة':d.st})));
  add('المفتوح',open.map(i=>{const s=stat(i);return{'الشركة':i.co,'الفاتورة':i.no,'العقد':i.contract,'القيمة':i.amount,'الفئة':i.cat||'','الخطوة':stepName(i),'الإدارة':deptOf(i),'الأيام':s.el,'الحالة':s.lbl}}));
  XLSX.writeFile(wb,`التقرير_الأسبوعي_${iso(TODAY)}.xlsx`)}

function tourReplay(k){
  INV=INV.filter(x=>!x.tour);let inv=null;
  for(let j=0;j<=k;j++){const s=TOUR[j];if(s.create){inv=tourInv();INV.push(inv)}if(inv&&s.act)s.act(inv)}
  const s=TOUR[k];TODAY=s.day==null?REAL_TODAY:tDay(s.day);
  S.tour=k;S.role=s.role;S.route=s.route;S.sel=T_ID;S.from=s.route==='inv'&&s.role.startsWith('co:')?'co-home':'list';S.modal='';S.notif=false;if(s.tab)S.companyTab=s.tab;else S.companyTab='all';
  render();if(s.after)s.after();window.scrollTo(0,0);
}
function startTour(){S.logged=true;tourReplay(0)}
function endTour(){S.tour=null;TODAY=REAL_TODAY;INV=INV.filter(x=>!x.tour);S.modal='';S.companyTab='all';setRole('admin')}
function tourCard(){
  if(S.tour==null)return'';const k=S.tour,s=TOUR[k],n=TOUR.length;
  return `<div class="tour"><div class="th"><span class="who"><i data-lucide="${s.ic}"></i>${esc(s.who)}</span><span class="num tc">${k+1} / ${n}</span><button class="btn sm" onclick="endTour()" title="إنهاء الجولة"><i data-lucide="x"></i></button></div>
   <h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>
   ${s.day!=null?`<div class="tdate"><i data-lucide="calendar"></i>اليوم ${s.day} من بداية المستخلص · <span class="num">${fmtD(TODAY)}</span></div>`:''}
   <div class="tprog"><span style="width:${(k+1)/n*100}%"></span></div>
   <div class="tb"><button class="btn" ${k===0?'disabled':''} onclick="tourReplay(${k-1})"><i data-lucide="arrow-right"></i>السابق</button>
   ${k<n-1?`<button class="btn pr" onclick="tourReplay(${k+1})">التالي<i data-lucide="arrow-left"></i></button>`:`<button class="btn pr" onclick="endTour()"><i data-lucide="check"></i>إنهاء الجولة</button>`}</div></div>`;
}

render();
